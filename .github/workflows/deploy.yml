name: Deploy API to Magalu Cloud

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Login no Magalu Cloud Container Registry
        uses: docker/login-action@v2
        with:
          registry: container-registry.br-se1.magalu.cloud # Exemplo de endpoint
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          
      - name: Build e Push da Imagem
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: container-registry.br-se1.magalu.cloud/rac-album/api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na Máquina Virtual via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker login container-registry.br-se1.magalu.cloud -u ${{ secrets.REGISTRY_USERNAME }} -p ${{ secrets.REGISTRY_PASSWORD }}
            docker pull container-registry.br-se1.magalu.cloud/rac-album/api:latest
            docker stop rac-album-api || true
            docker rm rac-album-api || true
            docker run -d --name rac-album-api -p 80:8080 container-registry.br-se1.magalu.cloud/rac-album/api:latest
